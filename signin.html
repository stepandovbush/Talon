<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talon: Sign in</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f4f4f3;
    --border: #e4e4e1;
    --text: #111110;
    --muted: #6b6b68;
    --accent: #111110;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .content { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 64px 24px 32px; }
  .back-btn {
    position: fixed;
    top: 24px;
    left: 24px;
    width: 34px; height: 34px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .back-btn:hover { background: var(--panel); }
  .wordmark {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.02em;
    text-decoration: none;
    color: var(--text);
    margin-bottom: 72px;
  }
  .wordmark img { height: 17px; width: auto; display: block; }

  form { width: 100%; max-width: 380px; }
  h1 { font-size: 26px; text-align: center; margin: 0 0 28px; letter-spacing: -0.02em; }

  .btn-google {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    cursor: pointer;
  }
  .btn-google:hover { background: var(--panel); }

  .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; color: var(--muted); font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  label { display: block; font-size: 14px; margin-bottom: 6px; }
  .field { margin-bottom: 16px; }
  .field-wrap { position: relative; }
  input[type="email"], input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    font-size: 15px;
    color: var(--text);
    background: var(--bg);
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  .toggle-eye {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    padding: 4px;
    display: flex;
  }

  .error-text { font-size: 13px; color: var(--danger); margin: -6px 0 16px; min-height: 16px; }

  .btn-submit {
    width: 100%;
    padding: 13px 16px;
    border-radius: 12px;
    border: none;
    background: #a8a8a4;
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    cursor: not-allowed;
    transition: background 0.15s ease;
  }
  .btn-submit.ready { background: var(--accent); cursor: pointer; }

  .switch { text-align: center; font-size: 14px; color: var(--muted); margin-top: 22px; }
  .switch a { color: var(--text); text-decoration: underline; }
</style>
</head>
<body>
  <button class="back-btn" onclick="history.back()" aria-label="Back" title="Back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
  </button>
  <div class="content">
    <a class="wordmark" href="index.html"><img src="assets/logo.png" alt="Talon logo">Talon</a>

    <form id="signin-form" novalidate>
      <h1>Sign in</h1>

      <button type="button" class="btn-google" id="google-btn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4C29.6 35.4 26.9 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.6 5.4C40.9 36.6 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/>
        </svg>
        Sign in with Google
      </button>

      <div class="divider">OR</div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="field-wrap">
          <input type="password" id="password" autocomplete="current-password" required>
          <button type="button" class="toggle-eye" id="toggle-eye" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="error-text" id="error-text"></div>

      <button type="submit" class="btn-submit" id="submit-btn" disabled>Sign in</button>

      <div class="switch">New here? <a href="signup.html">Sign up</a></div>
    </form>
  </div>


  <script>
    // Same origin split as home.html: only a local static preview (e.g.
    // Live Server on :5500) needs the API pointed at :8744 explicitly.
    const isLocalStaticPreview = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      && location.port && location.port !== '8744';
    const TALON_API = isLocalStaticPreview ? 'http://localhost:8744' : '';

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submit-btn');
    const errorText = document.getElementById('error-text');
    const toggleEye = document.getElementById('toggle-eye');
    const googleBtn = document.getElementById('google-btn');
    const form = document.getElementById('signin-form');

    // Google sign-in redirects back here with ?error=... on any failure
    // (denied consent, a stale state after a server restart mid-flow,
    // token exchange failing), silently landing on a blank form otherwise
    // looked like nothing happened, so people just retried the same
    // button and hit the same failure again.
    const GOOGLE_ERROR_MESSAGES = {
      invalid_state: "That Google sign-in link expired before you got back, try clicking Sign in with Google again.",
      google_signin_failed: "Google sign-in didn't go through, try again in a moment.",
      access_denied: "Google sign-in was cancelled.",
    };
    const urlError = new URLSearchParams(location.search).get('error');
    if (urlError) {
      errorText.textContent = GOOGLE_ERROR_MESSAGES[urlError] || `Google sign-in failed (${urlError}), try again.`;
      history.replaceState(null, '', 'signin.html');
    }

    function validate() {
      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value.trim());
      const passOk = passwordInput.value.length > 0;
      submitBtn.disabled = !(emailOk && passOk);
      submitBtn.classList.toggle('ready', emailOk && passOk);
    }
    emailInput.addEventListener('input', validate);
    passwordInput.addEventListener('input', validate);

    toggleEye.addEventListener('click', () => {
      passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
    });

    function enterApp(email) {
      localStorage.setItem('talon_user', email);
      window.location.href = localStorage.getItem('talon_onboarded') ? 'home.html' : 'onboarding.html';
    }

    googleBtn.addEventListener('click', () => {
      window.location.href = `${TALON_API}/api/google/account/start`;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (submitBtn.disabled) return;
      errorText.textContent = '';
      submitBtn.disabled = true;
      try {
        const res = await fetch(`${TALON_API}/api/signin`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email: emailInput.value.trim(), password: passwordInput.value }),
        });
        const data = await res.json();
        if (!res.ok) {
          errorText.textContent = data.error || 'Something went wrong, try again.';
          submitBtn.disabled = false;
          return;
        }
        enterApp(data.email);
      } catch (err) {
        errorText.textContent = `Couldn't reach Talon's backend (${err.message}).`;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
