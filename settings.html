<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talon Settings</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f4f4f3;
    --panel-2: #ececea;
    --border: #e4e4e1;
    --text: #111110;
    --muted: #6b6b68;
    --accent: #111110;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
  }

  .rail {
    width: 72px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 0;
    gap: 14px;
  }
  .rail-logo { display: block; margin-bottom: 22px; }
  .rail-logo img { height: 20px; width: auto; display: block; }
  .rail-btn {
    position: relative;
    width: 46px; height: 46px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    cursor: pointer;
    text-decoration: none;
  }
  .rail-btn.active { background: var(--panel); color: var(--text); }
  .rail-btn:hover { background: var(--panel); color: var(--text); }
  .rail-spacer { flex: 1; }

  .rail-btn::after {
    content: attr(data-tip);
    position: absolute;
    left: 56px;
    top: 50%;
    transform: translateY(-50%) translateX(-4px);
    background: var(--text);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: 7px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s ease, transform 0.12s ease;
    z-index: 20;
  }
  .rail-btn:hover::after { opacity: 1; transform: translateY(-50%) translateX(0); }

  .rail-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
  }

  .main { flex: 1; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center;
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
  }
  .topbar h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .back-btn {
    width: 34px; height: 34px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    margin-right: 6px;
  }
  .back-btn:hover { background: var(--panel); }

  .content {
    padding: 40px 28px;
    max-width: 480px;
  }
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
  }
  .settings-row:last-of-type { border-bottom: none; }
  .settings-row .label { font-size: 14px; font-weight: 500; }
  .settings-row .value { font-size: 13px; color: var(--muted); }
  .btn-danger {
    margin-top: 28px;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="rail">
    <a class="rail-logo" href="index.html"><img src="assets/logo.png" alt="Talon logo"></a>
    <a class="rail-btn" href="home.html" data-tip="Home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
    </a>
    <a class="rail-btn" href="cases.html" data-tip="Cases">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
    </a>
    <a class="rail-btn" href="report.html" data-tip="Report">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>
    </a>
    <a class="rail-btn" href="map.html" data-tip="Map">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 6l6-2 6 2 6-2v16l-6 2-6-2-6 2z"/><path d="M9 4v16"/><path d="M15 6v16"/></svg>
    </a>
    <div class="rail-spacer"></div>
    <a class="rail-btn" href="connect.html" data-tip="Connect">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
    </a>
    <a class="rail-btn" href="#" id="profile-btn" data-tip="Log out">
      <span class="rail-avatar" id="rail-avatar">T</span>
    </a>
    <a class="rail-btn active" href="settings.html" data-tip="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
    </a>
  </div>

  <div class="main">
    <div class="topbar">
      <button class="back-btn" onclick="history.back()" aria-label="Back" title="Back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      </button>
      <h1>Settings</h1>
    </div>
    <div class="content">
      <div class="settings-row">
        <div class="label">Account</div>
        <div class="value" id="account-email">-</div>
      </div>
      <div class="settings-row">
        <div class="label">Plan</div>
        <div class="value">Free (hackathon build)</div>
      </div>
      <div class="settings-row">
        <div class="label">Channels connected</div>
        <div class="value">0</div>
      </div>
      <button class="btn-danger" id="logout-btn">Log out</button>
    </div>
  </div>

  <script>
    const talonUser = localStorage.getItem('talon_user');
    if (!talonUser) {
      window.location.href = 'signin.html';
    } else {
      document.getElementById('rail-avatar').textContent = talonUser.trim().charAt(0).toUpperCase() || 'T';
      document.getElementById('account-email').textContent = talonUser;
    }
    function logout() {
      localStorage.removeItem('talon_user');
      localStorage.removeItem('talon_onboarded');
      window.location.href = 'index.html';
    }
    document.getElementById('profile-btn').addEventListener('click', (e) => { e.preventDefault(); logout(); });
    document.getElementById('logout-btn').addEventListener('click', logout);
  </script>
</body>
</html>
