<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talon Home</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f4f4f3;
    --panel-2: #ececea;
    --border: #e4e4e1;
    --text: #111110;
    --muted: #6b6b68;
    --accent: #111110;
    --online: #4caf7d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
  }

  /* Icon rail */
  .rail {
    width: 72px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 0;
    gap: 14px;
  }
  .rail-logo { display: block; margin-bottom: 22px; }
  .rail-logo img { height: 20px; width: auto; display: block; }
  .rail-btn {
    position: relative;
    width: 46px; height: 46px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    cursor: pointer;
    text-decoration: none;
  }
  .rail-btn.active { background: var(--panel); color: var(--text); }
  .rail-btn:hover { background: var(--panel); color: var(--text); }
  .rail-spacer { flex: 1; }

  .rail-btn::after {
    content: attr(data-tip);
    position: absolute;
    left: 56px;
    top: 50%;
    transform: translateY(-50%) translateX(-4px);
    background: var(--text);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: 7px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s ease, transform 0.12s ease;
    z-index: 20;
  }
  .rail-btn:hover::after { opacity: 1; transform: translateY(-50%) translateX(0); }

  .rail-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
  }

  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center;
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
  }
  .topbar h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .new-chat-btn {
    margin-left: auto;
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 500; color: var(--text);
    border: 1px solid var(--border); background: var(--bg);
    border-radius: 9px; padding: 8px 14px; cursor: pointer;
  }
  .new-chat-btn:hover { background: var(--panel); }
  .back-btn {
    width: 34px; height: 34px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    margin-right: 6px;
  }
  .back-btn:hover { background: var(--panel); }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 24px 40px;
    position: relative;
    overflow: hidden;
  }

  .hero-decor {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .decor-blob { position: absolute; border-radius: 40px; filter: blur(60px); }
  .decor-1 {
    width: 420px; height: 420px; top: -140px; right: -120px;
    background: linear-gradient(135deg, #ffd6a5, #ff9a9e 30%, #a29bfe 65%, #6ee7b7);
    opacity: 0.45; transform: rotate(18deg);
  }
  .decor-2 {
    width: 360px; height: 360px; bottom: -160px; left: -110px;
    background: linear-gradient(135deg, #a1c4fd, #c2e9fb 40%, #fbc2eb 70%, #fdcbf1);
    opacity: 0.4; transform: rotate(-12deg);
  }
  .decor-3 {
    width: 240px; height: 240px; top: 18%; left: 6%;
    background: linear-gradient(135deg, #fddb92, #6ee7b7);
    opacity: 0.28; transform: rotate(8deg);
  }
  .chat-mode .hero-decor { opacity: 0; }

  /* Hero ask */
  .hero-ask {
    width: 100%; max-width: 640px;
    height: calc(100vh - 130px);
    min-height: 420px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; z-index: 1;
  }

  .hero-badge {
    position: relative;
    width: 60px; height: 60px;
    margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.3s ease, max-height 0.3s ease, margin 0.3s ease;
    max-height: 60px; overflow: visible;
  }
  .hero-badge-glow {
    position: absolute; inset: -16px;
    background: radial-gradient(circle, rgba(110,231,183,0.55), transparent 70%);
    filter: blur(4px);
    border-radius: 50%;
  }
  .hero-badge-icon {
    position: relative;
    width: 50px; height: 50px; border-radius: 15px;
    background: var(--bg);
    border: 1px solid var(--border);
    box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    display: flex; align-items: center; justify-content: center;
  }
  .hero-badge-icon img { width: 21px; height: auto; display: block; }
  .chat-mode .hero-badge { opacity: 0; max-height: 0; margin: 0; }

  .hero-heading {
    font-size: 32px; font-weight: 700; letter-spacing: -0.02em;
    text-align: center; margin: 0 0 26px;
    max-height: 80px; overflow: hidden;
    transition: opacity 0.3s ease, max-height 0.3s ease, margin 0.3s ease;
    flex-shrink: 0;
  }
  .chat-mode .hero-heading { opacity: 0; max-height: 0; margin: 0; }

  .agent-chat {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex-grow: 0;
    min-height: 0;
    opacity: 0;
    overflow: hidden;
    padding: 4px 2px;
    transition: flex-grow 0.45s ease, opacity 0.35s ease, margin 0.35s ease;
  }
  .chat-mode .agent-chat { flex-grow: 1; opacity: 1; margin-bottom: 20px; overflow-y: auto; }
  .chat-msg { display: flex; gap: 9px; align-items: flex-end; }
  .chat-msg.user { flex-direction: row-reverse; }
  .chat-avatar-mini {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--panel); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .chat-avatar-mini img { width: 13px; height: auto; display: block; }
  .chat-bubble {
    max-width: 78%;
    text-align: left;
    padding: 10px 14px;
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    font-size: 14px;
    line-height: 1.45;
    background: var(--panel);
    color: var(--text);
  }
  .chat-msg.user .chat-bubble {
    background: var(--accent);
    color: #fff;
    border-bottom-left-radius: 14px;
    border-bottom-right-radius: 4px;
  }
  .chat-bubble.typing { display: flex; align-items: center; gap: 4px; padding: 13px 16px; }
  .typing-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--muted);
    animation: typingBlink 1.2s infinite ease-in-out;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingBlink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  /* Full-page transition shown right before handing off to Cases, so the
     jump reads as a deliberate step, not the page just vanishing. */
  .redirect-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: var(--bg);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px;
    animation: redirectFadeIn 0.15s ease;
  }
  .redirect-overlay.visible { display: flex; }
  @keyframes redirectFadeIn { from { opacity: 0; } to { opacity: 1; } }
  .redirect-badge { position: relative; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; }
  .redirect-badge-glow {
    position: absolute; inset: -16px;
    background: radial-gradient(circle, rgba(110,231,183,0.55), transparent 70%);
    filter: blur(4px); border-radius: 50%;
  }
  .redirect-badge-icon {
    position: relative; width: 50px; height: 50px; border-radius: 15px;
    background: var(--bg); border: 1px solid var(--border);
    box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    display: flex; align-items: center; justify-content: center;
  }
  .redirect-badge-icon img { width: 21px; height: auto; display: block; }
  .redirect-text { font-size: 15px; font-weight: 600; color: var(--text); }
  .redirect-dots { display: flex; gap: 4px; }

  .suggested-wrap {
    width: 100%;
    max-height: 130px;
    overflow: hidden;
    flex-shrink: 0;
    transition: opacity 0.3s ease, max-height 0.3s ease, margin 0.3s ease;
  }
  .chat-mode .suggested-wrap { opacity: 0; max-height: 0; margin: 0; pointer-events: none; }
  .suggested-label { font-size: 12px; color: var(--muted); text-align: center; margin: 20px 0 10px; }

  @keyframes askPulse { 0% { transform: scale(1); } 45% { transform: scale(1.015); } 100% { transform: scale(1); } }
  .ask-box {
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 18px 20px 14px;
    text-align: left;
    background: var(--bg);
    width: 100%;
    flex-shrink: 0;
    box-shadow: 0 8px 24px rgba(0,0,0,0.05);
  }
  .ask-box.pulse { animation: askPulse 0.5s ease; }
  .ask-box input {
    width: 100%;
    border: none;
    outline: none;
    font-size: 16px;
    color: var(--text);
    background: transparent;
    margin-bottom: 14px;
  }
  .ask-box-row { display: flex; align-items: center; gap: 10px; }
  .ask-plus {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--muted); font-size: 17px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .ask-channel-pill {
    display: flex; align-items: center; gap: 6px;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px 6px 8px;
    font-size: 13px;
    color: var(--muted);
    background: var(--bg);
    cursor: pointer;
  }
  .ask-row-spacer { flex: 1; }
  .ask-channel-icons { display: flex; gap: 6px; }
  .ask-channel-icon {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--panel); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
  }
  .ask-send {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--accent); color: #fff;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .quick-actions {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 10px; margin-top: 20px;
  }
  .quick-pill {
    display: flex; align-items: center; gap: 7px;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 9px 16px;
    font-size: 13.5px;
    color: var(--text);
    background: var(--bg);
    cursor: pointer;
  }
  .quick-pill:hover { background: var(--panel); }

  /* Split workspace: chat on the left, live agent activity on the right */
  .workspace {
    display: flex;
    width: 100%;
    max-width: 640px;
    height: calc(100vh - 130px);
    min-height: 420px;
    gap: 18px;
    align-items: stretch;
    position: relative;
    z-index: 1;
    transition: max-width 0.4s ease;
  }
  .workspace.panel-open { max-width: 1000px; }
  .workspace .hero-ask { flex: 1 1 640px; min-width: 0; max-width: 640px; margin: 0 auto; height: auto; }

  .agent-panel {
    flex: 0 0 0px;
    width: 0;
    opacity: 0;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--bg);
    box-shadow: 0 12px 32px rgba(0,0,0,0.07);
    display: flex;
    flex-direction: column;
    transition: flex-basis 0.35s ease, width 0.35s ease, opacity 0.3s ease;
    align-self: stretch;
    margin: auto 0;
    max-height: 78%;
  }
  .workspace.panel-open .agent-panel { flex: 0 0 320px; width: 320px; opacity: 1; }

  .agent-panel-header {
    display: flex; align-items: center; gap: 10px;
    padding: 15px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    border-radius: 18px 18px 0 0;
    flex-shrink: 0;
  }
  .agent-panel-header img { width: 15px; height: auto; display: block; flex-shrink: 0; }
  .agent-panel-header-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .agent-panel-title-row { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; }
  .agent-panel-sub { font-size: 10.5px; color: var(--muted); }
  .agent-panel-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--online);
    flex-shrink: 0;
    animation: agentPulse 1.4s infinite ease-in-out;
  }
  .agent-panel-dot.idle { background: var(--muted); animation: none; }
  @keyframes agentPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .agent-panel-steps {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px 18px 16px;
  }
  .agent-step {
    position: relative;
    display: flex; align-items: flex-start; gap: 10px;
    padding-left: 20px;
    padding-bottom: 14px;
    font-size: 12px;
    line-height: 1.45;
    color: var(--muted);
    animation: stepFadeIn 0.25s ease;
  }
  .agent-step:last-child { padding-bottom: 0; }
  .agent-step::before {
    /* connecting timeline line down to the next step */
    content: '';
    position: absolute;
    left: 5px; top: 15px; bottom: 0;
    width: 1px;
    background: var(--border);
  }
  .agent-step:last-child::before { display: none; }
  .agent-step.done { color: var(--text); }
  .agent-step-dot {
    position: absolute;
    left: 0; top: 3px;
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    box-sizing: border-box;
  }
  .agent-step.done .agent-step-dot { border-color: var(--online); background: var(--online); }
  .agent-step.done .agent-step-dot::after {
    content: '';
    width: 3px; height: 5px;
    border: solid #fff;
    border-width: 0 1.4px 1.4px 0;
    transform: rotate(45deg) translate(-0.5px, -0.5px);
  }
  .agent-step.active .agent-step-dot {
    border-color: var(--text);
    animation: agentRing 1s infinite ease-in-out;
  }
  @keyframes agentRing {
    0%, 100% { box-shadow: 0 0 0 0 rgba(17,17,16,0.14); }
    50% { box-shadow: 0 0 0 4px rgba(17,17,16,0.14); }
  }
  @keyframes stepFadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
  .agent-step-text { word-break: break-word; }
  .agent-step-text code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    background: var(--panel-2);
    padding: 1px 4px;
    border-radius: 4px;
  }

  /* Structured contact result card */
  .contact-card {
    max-width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .contact-card-title { font-size: 13px; font-weight: 600; color: var(--muted); }
  .contact-card-title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .contact-card-report-link {
    font-size: 11.5px; font-weight: 600; color: var(--text);
    text-decoration: none; white-space: nowrap; flex-shrink: 0;
  }
  .contact-card-report-link:hover { text-decoration: underline; }
  .contact-section { display: flex; flex-direction: column; gap: 10px; }
  .contact-section-label {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted);
  }
  .contact-section.unverified .contact-section-label { color: #b8860b; }
  .contact-row {
    display: flex; align-items: center; gap: 11px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 9px 12px;
  }
  .contact-section.unverified .contact-row { border-style: dashed; }
  .contact-icon {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .contact-icon svg { width: 15px; height: 15px; display: block; }
  .contact-row-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .contact-row-label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .contact-row-value {
    font-size: 13.5px; color: var(--text); text-decoration: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .contact-row-value:hover { text-decoration: underline; }
  .contact-unverified-hint { font-size: 11.5px; color: var(--muted); }
  .contact-empty { font-size: 13.5px; color: var(--muted); }

  .profile-section { gap: 12px; }
  .profile-about { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--text); }
  .founder-chip {
    display: flex; align-items: flex-start; gap: 11px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 12px;
  }
  .founder-avatar {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
  }
  .founder-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .founder-name-line { font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .founder-role {
    font-size: 10.5px; font-weight: 500; color: var(--muted);
    background: var(--panel-2); border-radius: 999px; padding: 2px 8px;
  }
  .founder-note { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .profile-facts { display: flex; flex-direction: column; gap: 6px; }
  .profile-fact { font-size: 12.5px; line-height: 1.5; color: var(--text); }
  .profile-fact-label {
    font-weight: 600; color: var(--muted); margin-right: 6px;
  }

  /* Outreach-sent card */
  .outreach-card { display: flex; flex-direction: column; gap: 12px; max-width: 100%; }
  .outreach-card-header { display: flex; align-items: center; gap: 12px; }
  .outreach-icon {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .outreach-icon svg { width: 16px; height: 16px; }
  .outreach-card-title { font-size: 14px; font-weight: 600; }
  .outreach-card-sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .outreach-preview {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .outreach-preview-subject { font-size: 13px; font-weight: 600; }
  .outreach-preview-text {
    font-size: 12.5px; line-height: 1.5; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .outreach-case-tag {
    align-self: flex-start;
    font-size: 11px; font-weight: 600; color: var(--muted);
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 10px;
  }

  /* Gap-calling, per-row quick action, similar companies, follow-up */
  .contact-gap-note {
    font-size: 12.5px; line-height: 1.5; color: #7a4a12;
    background: #fdf1e7; border: 1px solid #f0d9b8;
    border-radius: 10px; padding: 9px 12px;
  }
  .contact-gap-note a { color: #7a4a12; font-weight: 600; word-break: break-all; }
  .contact-row-action {
    flex-shrink: 0;
    font-size: 11.5px; font-weight: 600;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    border-radius: 999px; padding: 5px 11px;
    cursor: pointer;
  }
  .contact-row-action:hover { background: var(--panel-2); }
  .similar-section { gap: 10px; }
  .similar-company {
    border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;
    background: var(--bg);
  }
  .similar-company-title { font-size: 12.5px; font-weight: 600; }
  .mini-contact-list { display: flex; flex-direction: column; gap: 8px; }
  .mini-contact-list .contact-row { border-style: dashed; padding: 7px 10px; }
  .mini-contact-list .contact-icon { width: 24px; height: 24px; }
  .mini-contact-list .contact-icon svg { width: 12px; height: 12px; }
  .contact-follow-up {
    font-size: 12.5px; line-height: 1.5; color: var(--muted);
    border-top: 1px solid var(--border); padding-top: 12px;
  }
  .contact-next-steps-btn {
    align-self: flex-start;
    font-size: 12px; font-weight: 600; color: #fff;
    background: var(--accent); border: none;
    border-radius: 999px; padding: 7px 14px;
    cursor: pointer; margin-top: -4px;
  }
  .contact-next-steps-btn:hover { opacity: 0.85; }
  .contact-next-steps-btn:disabled { opacity: 0.5; cursor: default; }

  .backend-banner {

  @media (max-width: 900px) {

</style>

  <div class="redirect-overlay" id="redirect-overlay">

    <div class="redirect-text" id="redirect-text">Redirecting you to the case page...</div>
    <div class="redirect-dots"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>

  <script>
    // Talon's backend (server.py) always runs on :8744. This page itself may be
    // served from there directly, or previewed from a separate static server
    // (e.g. Live Server on :5500) — either way, API calls always target :8744.
    // Only a local static preview (e.g. Live Server on :5500) needs to be
    // pointed at the backend explicitly. Everywhere else -- served by
    // server.py directly on any host/port, including a real deployment --
    // the API is same-origin, so a relative path is correct.
    const isLocalStaticPreview = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      && location.port && location.port !== '8744';
    const TALON_API = isLocalStaticPreview ? 'http://localhost:8744' : '';

    // --- Chat transcript (defined first so it's ready before we use it below) ---
    const chat = document.getElementById('agent-chat');

    function addBubble(role, text) {
      const msg = document.createElement('div');
      msg.className = 'chat-msg ' + role;
      if (role === 'agent') {
        const av = document.createElement('span');
        av.className = 'chat-avatar-mini';
        av.innerHTML = '<img src="assets/logo.png" alt="">';
        msg.appendChild(av);
      }
      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble';
      bubble.textContent = text;
      msg.appendChild(bubble);
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
      return bubble;
    }

    function agentReply(text, delay = 850) {
      const msg = document.createElement('div');
      msg.className = 'chat-msg agent';
      const av = document.createElement('span');
      av.className = 'chat-avatar-mini';
      av.innerHTML = '<img src="assets/logo.png" alt="">';
      msg.appendChild(av);
      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble typing';
      bubble.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
      msg.appendChild(bubble);
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
      setTimeout(() => {
        bubble.classList.remove('typing');
        bubble.textContent = text;
        chat.scrollTop = chat.scrollHeight;
      }, delay);
    }

    // --- Landing -> chat transition ---
    let chatStarted = false;
    let displayName = 'there';
    const contentWrap = document.getElementById('content-wrap');
    const askBox = document.getElementById('ask-box');

    function enterChatMode() {
      if (chatStarted) return;
      chatStarted = true;
      contentWrap.classList.add('chat-mode');
      askBox.classList.add('pulse');
      setTimeout(() => askBox.classList.remove('pulse'), 500);
    }

    function sendToTalon(text, replyText) {
      if (!text.trim()) return;
      const isFirst = !chatStarted;
      enterChatMode();
      addBubble('user', text.trim());
      agentReply(isFirst ? `Hi ${displayName}. ${replyText}` : replyText);
    }

    // --- Live agent activity panel (right side) ---
    const workspace = document.getElementById('workspace');
    const agentPanelSteps = document.getElementById('agent-panel-steps');
    const agentPanelDot = document.getElementById('agent-panel-dot');
    const agentPanelTitle = document.getElementById('agent-panel-title');
    const agentPanelSub = document.getElementById('agent-panel-sub');
    let closePanelTimer = null;

    function openAgentPanel() {
      if (closePanelTimer) { clearTimeout(closePanelTimer); closePanelTimer = null; }
      agentPanelSteps.innerHTML = '';
      agentPanelDot.classList.remove('idle');
      agentPanelTitle.textContent = 'Talon is working';
      agentPanelSub.textContent = 'Live activity';
      workspace.classList.add('panel-open');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Renders a step line as text, styling any bare URL inside it as inline
    // code so file paths and links read cleanly against the plain steps.
    function formatStepText(text) {
      return escapeHtml(text).replace(/(https?:\/\/[^\s]+)/g, '<code>$1</code>');
    }

    function renderAgentSteps(steps, done) {
      agentPanelSteps.innerHTML = '';
      steps.forEach((text, i) => {
        const row = document.createElement('div');
        const isLast = i === steps.length - 1;
        row.className = 'agent-step ' + (isLast && !done ? 'active' : 'done');
        const dot = document.createElement('span');
        dot.className = 'agent-step-dot';
        row.appendChild(dot);
        const label = document.createElement('span');
        label.className = 'agent-step-text';
        label.innerHTML = formatStepText(text);
        row.appendChild(label);
        agentPanelSteps.appendChild(row);
      });
      agentPanelSteps.scrollTop = agentPanelSteps.scrollHeight;
      agentPanelSub.textContent = done ? `${steps.length} step${steps.length === 1 ? '' : 's'} complete` : `Step ${steps.length}...`;
      if (done) {
        agentPanelDot.classList.add('idle');
        agentPanelTitle.textContent = 'Done';
        closePanelTimer = setTimeout(() => workspace.classList.remove('panel-open'), 2200);
      }
    }

    // --- Structured contact card (emails + socials, with platform icons) ---
    const EMAIL_CATEGORY_META = {
      partnership: 'Partnership',
      general: 'General / Support',
      press: 'Press',
      careers: 'Careers',
      other: 'Other',
    };
    const EMAIL_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>';
    const PHONE_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6 19.8 19.8 0 01-3.1-8.7A2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .3 2 .7 3a2 2 0 01-.4 2.1L8 10.3a16 16 0 006 6l1.5-1.4a2 2 0 012.1-.4c1 .4 2 .6 3 .7a2 2 0 011.7 2z"/></svg>';
    const SOCIAL_META = {
      linkedin: { label: 'LinkedIn', color: '#0a66c2', svg: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M6.94 8.5H3.56V20h3.38V8.5zM5.25 3.6a1.96 1.96 0 100 3.92 1.96 1.96 0 000-3.92zM20.44 20h-3.37v-5.6c0-1.34-.02-3.05-1.86-3.05-1.87 0-2.16 1.46-2.16 2.96V20H9.68V8.5h3.24v1.57h.05c.45-.86 1.56-1.76 3.21-1.76 3.44 0 4.26 2.26 4.26 5.2V20z"/></svg>' },
      twitter: { label: 'X / Twitter', color: '#111110', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M4 4l16 16"/><path d="M20 4L4 20"/></svg>' },
      instagram: { label: 'Instagram', color: '#d6249f', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="0.9" fill="#fff" stroke="none"/></svg>' },
      facebook: { label: 'Facebook', color: '#1877f2', svg: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M14 9h2.5V6H14c-2 0-3.5 1.6-3.5 3.6V11H8v3h2.5v6H13v-6h2.3l.4-3H13V9.8c0-.5.3-.8.7-.8z"/></svg>' },
      tiktok: { label: 'TikTok', color: '#111110', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M9 4v11.2a3.3 3.3 0 11-2-3.03"/><path d="M9 4c.4 2.3 2.3 4.2 4.6 4.5"/></svg>' },
      youtube: { label: 'YouTube', color: '#ff0000', svg: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M9 8.3l7 3.7-7 3.7z"/></svg>' },
    };

    function socialHandle(name, url) {
      try {
        const u = new URL(url);
        const parts = u.pathname.split('/').filter(Boolean);
        if (name === 'linkedin' || name === 'youtube') return parts.join('/') || u.hostname;
        // The page/profile name is always the first path segment (facebook.com/formaloo/about
        // is the "about" tab of the "formaloo" page, not a page called "about").
        const handle = parts[0] || u.hostname;
        return handle.startsWith('@') ? handle : '@' + handle;
      } catch (e) {
        return url;
      }
    }

    function contactRow(iconSvg, iconColor, label, valueText, href, emailForCompose) {
      const row = document.createElement('div');
      row.className = 'contact-row';
      const icon = document.createElement('span');
      icon.className = 'contact-icon';
      icon.style.background = iconColor;
      icon.innerHTML = iconSvg;
      row.appendChild(icon);
      const textWrap = document.createElement('div');
      textWrap.className = 'contact-row-text';
      const labelEl = document.createElement('span');
      labelEl.className = 'contact-row-label';
      labelEl.textContent = label;
      textWrap.appendChild(labelEl);
      const valueEl = document.createElement('a');
      valueEl.className = 'contact-row-value';
      valueEl.textContent = valueText;
      valueEl.href = href;
      if (!href.startsWith('mailto:')) { valueEl.target = '_blank'; valueEl.rel = 'noopener'; }
      textWrap.appendChild(valueEl);
      row.appendChild(textWrap);

      // Only emails can actually be messaged (that's the only channel Talon
      // sends through today) -- prefill the composer, don't fake a social DM.
      if (emailForCompose) {
        const msgBtn = document.createElement('button');
        msgBtn.type = 'button';
        msgBtn.className = 'contact-row-action';
        msgBtn.textContent = 'Message';
        msgBtn.title = `Draft a message to ${emailForCompose}`;
        msgBtn.addEventListener('click', () => {
          const input = document.getElementById('composer-input');
          input.value = `Email ${emailForCompose} about `;
          input.focus();
          input.setSelectionRange(input.value.length, input.value.length);
        });
        row.appendChild(msgBtn);
      }
      return row;
    }

    function initials(name) {
      return name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('');
    }

    function renderProfileSection(profile) {
      const section = document.createElement('div');
      section.className = 'contact-section profile-section';

      if (profile.about) {
        const about = document.createElement('p');
        about.className = 'profile-about';
        about.textContent = profile.about;
        section.appendChild(about);
      }

      if (profile.founders && profile.founders.length) {
        const label = document.createElement('div');
        label.className = 'contact-section-label';
        label.textContent = profile.founders.length > 1 ? 'Founders' : 'Founder';
        section.appendChild(label);
        profile.founders.forEach((f) => {
          const chip = document.createElement('div');
          chip.className = 'founder-chip';
          const avatar = document.createElement('span');
          avatar.className = 'founder-avatar';
          avatar.textContent = initials(f.name || '?');
          chip.appendChild(avatar);
          const textWrap = document.createElement('div');
          textWrap.className = 'founder-text';
          const nameLine = document.createElement('div');
          nameLine.className = 'founder-name-line';
          nameLine.textContent = f.name || 'Unknown';
          if (f.role) {
            const roleTag = document.createElement('span');
            roleTag.className = 'founder-role';
            roleTag.textContent = f.role;
            nameLine.appendChild(roleTag);
          }
          textWrap.appendChild(nameLine);
          if (f.note) {
            const note = document.createElement('div');
            note.className = 'founder-note';
            note.textContent = f.note;
            textWrap.appendChild(note);
          }
          chip.appendChild(textWrap);
          section.appendChild(chip);
        });
      }

      if (profile.offers || profile.looking_for) {
        const facts = document.createElement('div');
        facts.className = 'profile-facts';
        if (profile.offers) {
          const row = document.createElement('div');
          row.className = 'profile-fact';
          row.innerHTML = '<span class="profile-fact-label">Offers</span>';
          const val = document.createElement('span');
          val.textContent = profile.offers;
          row.appendChild(val);
          facts.appendChild(row);
        }
        if (profile.looking_for) {
          const row = document.createElement('div');
          row.className = 'profile-fact';
          row.innerHTML = '<span class="profile-fact-label">Looking for</span>';
          const val = document.createElement('span');
          val.textContent = profile.looking_for;
          row.appendChild(val);
          facts.appendChild(row);
        }
        section.appendChild(facts);
      }

      return section.childNodes.length ? section : null;
    }

    function renderMiniContactList(contacts) {
      const wrap = document.createElement('div');
      wrap.className = 'mini-contact-list';
      const emailEntries = Object.entries(contacts.emails || {}).filter(([, list]) => list.length);
      emailEntries.forEach(([category, emails]) => {
        emails.forEach((email) => {
          wrap.appendChild(contactRow(
            EMAIL_ICON_SVG, '#ea4335', EMAIL_CATEGORY_META[category] || category,
            email, `mailto:${email}`, email,
          ));
        });
      });
      (contacts.phones || []).forEach((phone) => {
        wrap.appendChild(contactRow(PHONE_ICON_SVG, '#34a853', 'Phone', phone, `tel:${phone}`));
      });
      Object.entries(contacts.socials || {}).forEach(([name, url]) => {
        const meta = SOCIAL_META[name] || { label: name, color: '#6b6b68', svg: EMAIL_ICON_SVG };
        wrap.appendChild(contactRow(meta.svg, meta.color, meta.label, socialHandle(name, url), url));
      });
      return wrap;
    }

    function renderContactsCard(company, contacts, profile, want, requestedFound, similarCompanies, reportId, routes) {
      const card = document.createElement('div');
      card.className = 'contact-card';

      const titleRow = document.createElement('div');
      titleRow.className = 'contact-card-title-row';
      const title = document.createElement('div');
      title.className = 'contact-card-title';
      title.textContent = company ? `Contact info for ${company}` : 'What I found';
      titleRow.appendChild(title);
      if (reportId) {
        const reportLink = document.createElement('a');
        reportLink.className = 'contact-card-report-link';
        reportLink.href = `report.html?id=${encodeURIComponent(reportId)}`;
        reportLink.textContent = 'View full report →';
        titleRow.appendChild(reportLink);
      }
      card.appendChild(titleRow);

      // Be upfront when the specific thing asked for wasn't there, before
      // showing whatever else was found instead of silently substituting.
      if (want && want !== 'any' && requestedFound === false) {
        const GAP_LABELS = {
          partnership: 'a public partnership email',
          general: 'a public general/support email',
          press: 'a public press email',
          careers: 'a public careers email',
          social: 'a linked social profile',
        };
        const gap = document.createElement('div');
        gap.className = 'contact-gap-note';
        gap.textContent = `${company} doesn't have ${GAP_LABELS[want] || `a public ${want}`} on file. Here's everything else found instead:`;
        card.appendChild(gap);
      }

      // No partnership or general email at all is the case worth calling
      // out directly, since those are the two categories people actually
      // reach out through -- point straight at their own support/contact
      // page instead of leaving the user with nothing.
      const hasDirectEmail = Boolean(
        (contacts.emails && contacts.emails.partnership && contacts.emails.partnership.length) ||
        (contacts.emails && contacts.emails.general && contacts.emails.general.length)
      );
      if (!hasDirectEmail && contacts.support_page) {
        const fallback = document.createElement('div');
        fallback.className = 'contact-gap-note';
        fallback.append(`No partnership or support email found for ${company}. Here's their support page directly: `);
        const link = document.createElement('a');
        link.href = contacts.support_page;
        link.textContent = contacts.support_page;
        link.target = '_blank';
        link.rel = 'noopener';
        fallback.appendChild(link);
        card.appendChild(fallback);
      }

      if (profile) {
        const profileSection = renderProfileSection(profile);
        if (profileSection) card.appendChild(profileSection);
      }

      const emailEntries = Object.entries(contacts.emails || {}).filter(([, list]) => list.length);
      if (emailEntries.length) {
        const section = document.createElement('div');
        section.className = 'contact-section';
        const label = document.createElement('div');
        label.className = 'contact-section-label';
        label.textContent = 'Emails';
        section.appendChild(label);
        emailEntries.forEach(([category, emails]) => {
          emails.forEach((email) => {
            section.appendChild(contactRow(
              EMAIL_ICON_SVG, '#ea4335',
              EMAIL_CATEGORY_META[category] || category,
              email, `mailto:${email}`, email,
            ));
          });
        });
        card.appendChild(section);
      }

      const phones = contacts.phones || [];
      if (phones.length) {
        const section = document.createElement('div');
        section.className = 'contact-section';
        const label = document.createElement('div');
        label.className = 'contact-section-label';
        label.textContent = 'Phone numbers';
        section.appendChild(label);
        phones.forEach((phone) => {
          section.appendChild(contactRow(PHONE_ICON_SVG, '#34a853', 'Phone', phone, `tel:${phone}`));
        });
        card.appendChild(section);
      }

      const socials = Object.entries(contacts.socials || {});
      if (socials.length) {
        const section = document.createElement('div');
        section.className = 'contact-section';
        const label = document.createElement('div');
        label.className = 'contact-section-label';
        label.textContent = 'Social profiles';
        section.appendChild(label);
        socials.forEach(([name, url]) => {
          const meta = SOCIAL_META[name] || { label: name, color: '#6b6b68', svg: EMAIL_ICON_SVG };
          section.appendChild(contactRow(meta.svg, meta.color, meta.label, socialHandle(name, url), url));
        });
        card.appendChild(section);
      }

      const unverified = Object.entries(contacts.socials_unverified || {});
      if (unverified.length) {
        const section = document.createElement('div');
        section.className = 'contact-section unverified';
        const label = document.createElement('div');
        label.className = 'contact-section-label';
        label.textContent = 'Unverified';
        section.appendChild(label);
        const hint = document.createElement('div');
        hint.className = 'contact-unverified-hint';
        hint.textContent = 'Found via search only, not linked from their own site. Double check before trusting.';
        section.appendChild(hint);
        unverified.forEach(([name, url]) => {
          const meta = SOCIAL_META[name] || { label: name, color: '#6b6b68', svg: EMAIL_ICON_SVG };
          section.appendChild(contactRow(meta.svg, meta.color, meta.label, socialHandle(name, url), url));
        });
        card.appendChild(section);
      }

      if (!emailEntries.length && !phones.length && !socials.length && !unverified.length) {
        const empty = document.createElement('div');
        empty.className = 'contact-empty';
        empty.textContent = 'No public contact info found.';
        card.appendChild(empty);
      }

      // Proactive: researched comparable companies without being asked, in
      // case the user is weighing options rather than fixed on one company.
      if (similarCompanies && similarCompanies.length) {
        const section = document.createElement('div');
        section.className = 'contact-section similar-section';
        const label = document.createElement('div');
        label.className = 'contact-section-label';
        label.textContent = 'Also worth knowing: similar companies';
        section.appendChild(label);
        similarCompanies.forEach((peer) => {
          const peerCard = document.createElement('div');
          peerCard.className = 'similar-company';
          const peerTitle = document.createElement('div');
          peerTitle.className = 'similar-company-title';
          peerTitle.textContent = peer.name;
          peerCard.appendChild(peerTitle);
          peerCard.appendChild(renderMiniContactList(peer.contacts));
          section.appendChild(peerCard);
        });
        card.appendChild(section);
      }

      const followUp = document.createElement('div');
      followUp.className = 'contact-follow-up';
      followUp.textContent = 'Want me to send a message to any of these? Tell me who and what to say, or click "Message" next to an email.';
      card.appendChild(followUp);

      if (reportId) {
        const nextStepsBtn = document.createElement('button');
        nextStepsBtn.type = 'button';
        nextStepsBtn.className = 'contact-next-steps-btn';
        nextStepsBtn.textContent = "What's next?";
        nextStepsBtn.addEventListener('click', () => {
          nextStepsBtn.disabled = true;
          agentReply(composeNextStepsSummary(company, routes, similarCompanies), 500);
        });
        card.appendChild(nextStepsBtn);
      }

      return card;
    }

    // Composed client-side from the same data already on screen -- no extra
    // backend call, just a plain-language recap of what got saved and what
    // Talon can do from here.
    function composeNextStepsSummary(company, routes, similarCompanies) {
      const parts = [`I've saved a full report on ${company} and added it to your Map.`];
      if (routes && routes.length) {
        const top = routes[0];
        parts.push(`Best route so far: ${top.label}${top.confidence ? ` (${top.confidence} confidence)` : ''}.`);
        if (routes.length > 1) {
          parts.push(`I ranked ${routes.length} routes total, from most to least likely to get a response, check the Map for the full order.`);
        }
      }
      if (similarCompanies && similarCompanies.length) {
        const n = similarCompanies.length;
        parts.push(`I also looked into ${n} comparable ${n === 1 ? 'company' : 'companies'} in case this one goes cold.`);
      }
      parts.push('From here I can draft outreach, keep tracking replies automatically once it is sent, or dig into a different angle, just tell me what you need.');
      return parts.join(' ');
    }

    const SEND_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>';

    function renderOutreachCard(result) {
      const card = document.createElement('div');
      card.className = 'outreach-card';

      const header = document.createElement('div');
      header.className = 'outreach-card-header';
      const icon = document.createElement('span');
      icon.className = 'outreach-icon';
      icon.innerHTML = SEND_ICON_SVG;
      header.appendChild(icon);
      const headerText = document.createElement('div');
      const titleEl = document.createElement('div');
      titleEl.className = 'outreach-card-title';
      titleEl.textContent = `Emailing ${result.recipient}`;
      headerText.appendChild(titleEl);
      const subEl = document.createElement('div');
      subEl.className = 'outreach-card-sub';
      subEl.textContent = "I'll let you know the moment someone responds.";
      headerText.appendChild(subEl);
      header.appendChild(headerText);
      card.appendChild(header);

      if (result.subject || result.preview) {
        const preview = document.createElement('div');
        preview.className = 'outreach-preview';
        if (result.subject) {
          const subj = document.createElement('div');
          subj.className = 'outreach-preview-subject';
          subj.textContent = result.subject;
          preview.appendChild(subj);
        }
        if (result.preview) {
          const body = document.createElement('div');
          body.className = 'outreach-preview-text';
          body.textContent = result.preview;
          preview.appendChild(body);
        }
        card.appendChild(preview);
      }

      if (result.case_id) {
        const tag = document.createElement('div');
        tag.className = 'outreach-case-tag';
        tag.textContent = `Case ${result.case_id}`;
        card.appendChild(tag);
      }

      return card;
    }

    // Several real, unrelated companies can share a name (Coda the
    // workspace vs Coda the payments platform). Rather than guess and
    // possibly research the wrong one, show the real candidates found and
    // let the user pick -- logo via Google's public favicon service, falls
    // back to an initial if a domain has none.
    function renderDisambiguationCard(result) {
      const card = document.createElement('div');
      card.className = 'contact-card';
      const title = document.createElement('div');
      title.className = 'contact-card-title';
      title.textContent = `What company called "${result.name}" are you looking for?`;
      card.appendChild(title);

      const list = document.createElement('div');
      list.className = 'disambiguate-list';
      (result.candidates || []).forEach((c) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'disambiguate-option';

        const logo = document.createElement('img');
        logo.className = 'disambiguate-logo';
        logo.src = `https://www.google.com/s2/favicons?domain=${c.domain}&sz=64`;
        logo.alt = '';
        const fallback = document.createElement('span');
        fallback.className = 'disambiguate-logo-fallback';
        fallback.textContent = (c.name || '?').charAt(0).toUpperCase();
        fallback.style.display = 'none';
        logo.addEventListener('error', () => {
          logo.style.display = 'none';
          fallback.style.display = 'flex';
        });
        btn.appendChild(logo);
        btn.appendChild(fallback);

        const textWrap = document.createElement('div');
        textWrap.className = 'disambiguate-text';
        const nameEl = document.createElement('div');
        nameEl.className = 'disambiguate-name';
        nameEl.textContent = c.name;
        textWrap.appendChild(nameEl);
        const domainEl = document.createElement('div');
        domainEl.className = 'disambiguate-domain';
        domainEl.textContent = c.domain;
        textWrap.appendChild(domainEl);
        if (c.description) {
          const descEl = document.createElement('div');
          descEl.className = 'disambiguate-desc';
          descEl.textContent = c.description;
          textWrap.appendChild(descEl);
        }
        btn.appendChild(textWrap);

        btn.addEventListener('click', () => chooseDisambiguationCandidate(result.query, c));
        list.appendChild(btn);
      });

      // Always offer a manual escape hatch, not just when nothing was
      // found -- a same-named company Talon's search never surfaced at
      // all (too small, too new, no real web presence) still needs a way
      // in, so the user can hand it the name and site directly instead of
      // being stuck picking from a list that doesn't have it.
      if (result.allow_other !== false) {
        const otherBtn = document.createElement('button');
        otherBtn.type = 'button';
        otherBtn.className = 'disambiguate-option other';
        const icon = document.createElement('span');
        icon.className = 'disambiguate-other-icon';
        icon.textContent = '+';
        otherBtn.appendChild(icon);
        const otherLabel = document.createElement('span');
        otherLabel.textContent = "Other, I'll specify the company";
        otherBtn.appendChild(otherLabel);
        otherBtn.addEventListener('click', () => {
          otherBtn.replaceWith(renderDisambiguateOtherForm(result.query));
        });
        list.appendChild(otherBtn);
      }

      card.appendChild(list);
      return card;
    }

    function renderDisambiguateOtherForm(query) {
      const wrap = document.createElement('div');
      wrap.className = 'disambiguate-other-form';

      const hint = document.createElement('p');
      hint.className = 'disambiguate-other-hint';
      hint.textContent = "Company name, and its website if you know it (optional, helps Talon find the right one).";
      wrap.appendChild(hint);

      const nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.placeholder = 'Company name';
      wrap.appendChild(nameInput);

      const siteInput = document.createElement('input');
      siteInput.type = 'text';
      siteInput.placeholder = 'Website (optional, e.g. acme.com)';
      wrap.appendChild(siteInput);

      const row = document.createElement('div');
      row.className = 'disambiguate-other-row';
      const submitBtn = document.createElement('button');
      submitBtn.type = 'button';
      submitBtn.textContent = 'Search';
      row.appendChild(submitBtn);
      wrap.appendChild(row);

      submitBtn.addEventListener('click', () => {
        const name = nameInput.value.trim();
        if (!name) {
          nameInput.focus();
          return;
        }
        const site = siteInput.value.trim();
        submitBtn.disabled = true;
        chooseDisambiguationCandidate(query, { name, domain: site || null }, wrap);
      });
      nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitBtn.click(); });
      siteInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitBtn.click(); });

      setTimeout(() => nameInput.focus(), 0);
      return wrap;
    }

    async function chooseDisambiguationCandidate(query, candidate, formEl) {
      const chosenText = candidate.domain ? `${candidate.name} (${candidate.domain})` : candidate.name;
      if (formEl) formEl.remove();
      addBubble('user', chosenText);
      appendTurn({ role: 'user', text: chosenText });
      const bubble = createPendingAgentBubble();
      try {
        const startRes = await fetch(`${TALON_API}/api/talon/start`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: query, resolved_company: candidate.name, resolved_domain: candidate.domain || '' }),
        });
        const startData = await startRes.json();
        if (!startData.job_id) throw new Error(startData.error || 'failed to start');
        saveActiveJob(startData.job_id, query, false);
        await pollJobAndRender(startData.job_id, bubble, false);
      } catch (err) {
        bubble.classList.remove('typing');
        bubble.textContent = `Couldn't reach Talon's backend at ${TALON_API || location.origin} (${err.message}).`;
        checkBackend();
      }
    }

    // Live version: actually calls the backend agent, polls for progress, and
    // opens the agent activity panel while it works.
    // The job itself runs server-side in its own thread -- it was never
    // actually stopped by navigating away. What broke was the UI losing
    // track of it, since polling lived only in this page's memory. Persist
    // the active job so leaving Home and coming back (or even closing the
    // tab) resumes watching it, or shows the result immediately if it
    // finished while you were away.
    const ACTIVE_JOB_KEY = 'talon_active_job';

    function saveActiveJob(jobId, text, isFirst) {
      localStorage.setItem(ACTIVE_JOB_KEY, JSON.stringify({ jobId, text, isFirst }));
    }
    function clearActiveJob() {
      localStorage.removeItem(ACTIVE_JOB_KEY);
    }
    function loadActiveJob() {
      try { return JSON.parse(localStorage.getItem(ACTIVE_JOB_KEY) || 'null'); } catch (e) { return null; }
    }

    // The whole conversation persists (not just whatever's in flight), so
    // closing the tab or clicking around the app never loses it -- only
    // "New chat" clears it. Capped so localStorage doesn't grow unbounded.
    const TRANSCRIPT_KEY = 'talon_chat_history';
    const MAX_TURNS = 60;

    function loadTranscript() {
      try {
        return JSON.parse(localStorage.getItem(TRANSCRIPT_KEY)) || { turns: [], lastCompany: null };
      } catch (e) {
        return { turns: [], lastCompany: null };
      }
    }
    function saveTranscript(t) {
      localStorage.setItem(TRANSCRIPT_KEY, JSON.stringify(t));
    }
    function appendTurn(turn, company) {
      const t = loadTranscript();
      t.turns.push(turn);
      if (t.turns.length > MAX_TURNS) t.turns = t.turns.slice(-MAX_TURNS);
      if (company) t.lastCompany = company;
      saveTranscript(t);
    }
    function clearTranscript() {
      localStorage.removeItem(TRANSCRIPT_KEY);
    }

    function renderResultIntoBubble(bubble, result) {
      bubble.classList.remove('typing');
      bubble.textContent = '';
      if (result && result.kind === 'contacts') {
        bubble.appendChild(renderContactsCard(
          result.company, result.contacts, result.profile,
          result.want, result.requested_found, result.similar_companies,
          result.report_id, result.routes,
        ));
      } else if (result && result.kind === 'outreach') {
        bubble.appendChild(renderOutreachCard(result));
      } else if (result && result.kind === 'disambiguate') {
        bubble.appendChild(renderDisambiguationCard(result));
      } else if (result && result.kind === 'outreach_pending') {
        const link = document.createElement('a');
        link.href = 'cases.html';
        link.textContent = `I sent this to Cases for you to confirm sending to ${result.recipient}. →`;
        link.style.color = 'inherit';
        bubble.appendChild(link);
      } else {
        bubble.textContent = (result && result.reply) || 'Something went wrong, try again.';
      }
    }

    function renderTurn(turn) {
      if (turn.role === 'user') {
        addBubble('user', turn.text);
        return;
      }
      const msg = document.createElement('div');
      msg.className = 'chat-msg agent';
      const av = document.createElement('span');
      av.className = 'chat-avatar-mini';
      av.innerHTML = '<img src="assets/logo.png" alt="">';
      msg.appendChild(av);
      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble';
      msg.appendChild(bubble);
      chat.appendChild(msg);
      renderResultIntoBubble(bubble, turn.data);
    }

    function createPendingAgentBubble() {
      const msg = document.createElement('div');
      msg.className = 'chat-msg agent';
      const av = document.createElement('span');
      av.className = 'chat-avatar-mini';
      av.innerHTML = '<img src="assets/logo.png" alt="">';
      msg.appendChild(av);
      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble typing';
      bubble.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
      msg.appendChild(bubble);
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
      return bubble;
    }

    async function pollJobAndRender(jobId, bubble, isFirst) {
      openAgentPanel();
      try {
        let result = null;
        while (true) {
          const statusRes = await fetch(`${TALON_API}/api/talon/status/${jobId}`);
          const statusData = await statusRes.json();
          renderAgentSteps(statusData.steps || [], statusData.done);
          if (statusData.done) { result = statusData.result; break; }
          await new Promise((resolve) => setTimeout(resolve, 350));
        }

        // Gmail is connected, so this outreach send needs confirming on
        // Cases (permission, clarification, mood/style) before it
        // actually goes out, not a fire-and-forget send from here. Record
        // it in history first so it makes sense if the user comes back to
        // Home later, then show a brief "redirecting" transition (capped
        // at 2s, not a real wait) before jumping to Cases, so the handoff
        // reads as deliberate instead of the page just vanishing.
        if (result && result.kind === 'outreach_pending') {
          appendTurn({ role: 'agent', kind: result.kind, data: result }, result.company || null);
          clearActiveJob();
          bubble.classList.remove('typing');
          bubble.textContent = `I sent this to Cases for you to confirm sending to ${result.recipient}.`;
          document.getElementById('redirect-overlay').classList.add('visible');
          setTimeout(() => {
            window.location.href = `cases.html?pending=${encodeURIComponent(jobId)}`;
          }, 1200);
          return;
        }

        if (!result || (result.kind !== 'contacts' && result.kind !== 'outreach' && result.kind !== 'disambiguate')) {
          const replyText = (result && result.reply) || 'Something went wrong, try again.';
          result = { kind: 'message', reply: isFirst ? `Hi ${displayName}. ${replyText}` : replyText };
        }
        renderResultIntoBubble(bubble, result);
        appendTurn({ role: 'agent', kind: result.kind, data: result }, result.company || null);
        clearActiveJob();
      } catch (err) {
        renderAgentSteps(['Lost connection to the backend'], true);
        bubble.classList.remove('typing');
        bubble.textContent =
          `Couldn't reach Talon's backend at ${TALON_API || location.origin} (${err.message}). ` +
          "Make sure server.py is actually running: `python server.py` in the " +
          "caspian hackathon folder. The job itself is still running there, " +
          "reload this page once it's back up to pick the result back up.";
        checkBackend();
      }
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendToTalonLive(text) {
      text = text.trim();
      if (!text) return;
      const isFirst = !chatStarted;
      enterChatMode();
      addBubble('user', text);
      appendTurn({ role: 'user', text });
      const bubble = createPendingAgentBubble();

      try {
        const startRes = await fetch(`${TALON_API}/api/talon/start`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, context_company: loadTranscript().lastCompany }),
        });
        const startData = await startRes.json();
        if (!startData.job_id) throw new Error(startData.error || 'failed to start');
        saveActiveJob(startData.job_id, text, isFirst);
        await pollJobAndRender(startData.job_id, bubble, isFirst);
      } catch (err) {
        bubble.classList.remove('typing');
        bubble.textContent =
          `Couldn't reach Talon's backend at ${TALON_API || location.origin} (${err.message}). ` +
          "Make sure server.py is actually running.";
        checkBackend();
      }
    }

    // --- Backend reachability check, so a wrong origin (file://, a static-file
    // preview on another port, etc.) is diagnosed immediately instead of only
    // failing silently the moment you send a message. ---
    const backendBanner = document.getElementById('backend-banner');
    async function checkBackend() {
      try {
        const res = await fetch(`${TALON_API}/api/health`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        backendBanner.classList.remove('show');
      } catch (err) {
        backendBanner.classList.add('show');
        backendBanner.innerHTML =
          `Talon's backend isn't reachable at <code>${TALON_API || location.origin}</code> (${err.message}). ` +
          "Run <code>python server.py</code> in the caspian hackathon folder and leave it " +
          "running, then reload this page.";
      }
    }
    checkBackend();

    const talonUser = localStorage.getItem('talon_user');
    if (!talonUser) {
      window.location.href = 'signin.html';
    } else {
      const cleanUser = talonUser.trim();
      document.getElementById('rail-avatar').textContent = cleanUser.charAt(0).toUpperCase() || 'T';

      // Derive a display name from the email (no name field at signup yet)
      const localPart = cleanUser.includes('@') ? cleanUser.split('@')[0] : cleanUser;
      displayName = localPart
        .replace(/[._]+/g, ' ')
        .split(' ')
        .filter(Boolean)
        .map((w) => w.charAt(0).toUpperCase() + w.slice(1))
        .join(' ') || 'there';

      document.getElementById('hero-heading').textContent = `What do you need Talon to do, ${displayName}?`;

      // The conversation isn't limited to one page view -- replay whatever
      // was said before, so the chat keeps going across reloads instead of
      // resetting every time you come back to Home.
      const transcript = loadTranscript();
      if (transcript.turns.length) {
        enterChatMode();
        transcript.turns.forEach(renderTurn);
        chat.scrollTop = chat.scrollHeight;
      }

      // Pick a job back up if one was left running (navigated away, closed
      // the tab, whatever) -- the backend never stopped working on it, so
      // resume watching it instead of losing track. Its user turn is
      // already in the transcript above (recorded at send time), so only
      // the pending agent bubble needs adding here.
      const pending = loadActiveJob();
      if (pending) {
        enterChatMode();
        const bubble = createPendingAgentBubble();
        pollJobAndRender(pending.jobId, bubble, pending.isFirst);
      }
    }

    function startNewChat() {
      clearTranscript();
      clearActiveJob();
      chat.innerHTML = '';
      chatStarted = false;
      contentWrap.classList.remove('chat-mode');
      workspace.classList.remove('panel-open');
    }
    document.getElementById('new-chat-btn').addEventListener('click', startNewChat);

    function logout() {
      localStorage.removeItem('talon_user');
      localStorage.removeItem('talon_onboarded');
      window.location.href = 'index.html';
    }
    document.getElementById('profile-btn').addEventListener('click', (e) => {
      e.preventDefault();
      logout();
    });

    const input = document.getElementById('composer-input');
    document.getElementById('composer-send').addEventListener('click', () => {
      const text = input.value;
      input.value = '';
      sendToTalonLive(text);
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('composer-send').click();
    });

    // Coming from the Map's "Draft this now" link: prefill the composer
    // with the suggested opener instead of making the user retype it.
    const prefill = new URLSearchParams(location.search).get('prefill');
    if (prefill) {
      input.value = prefill;
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
      history.replaceState(null, '', 'home.html');
    }
    document.getElementById('ask-attach').addEventListener('click', () => {
      enterChatMode();
      agentReply("Attachments aren't wired up yet.");
    });
    document.getElementById('ask-channel-pill').addEventListener('click', () => {
      enterChatMode();
      agentReply("Connect an account first from the Connect tab, then I can send through it.");
    });
    document.querySelectorAll('.quick-pill').forEach((btn) => {
      btn.addEventListener('click', () => { sendToTalon(btn.textContent, btn.dataset.note); });
    });
  </script>
</body>
</html>
